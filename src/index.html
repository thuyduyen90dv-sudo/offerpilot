function head(title,sub,actions=''){return '<div class="pagehead"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+actions+'</div></div>';}
function card(title,content,action='',ic=''){return '<section class="card"><div class="card-head"><h2>'+(ic?icon(ic):'')+title+'</h2>'+action+'</div>'+content+'</section>';}
function flow(){const r=state.runs[0],step=r?.step||0;return '<div class="flow">'+['发现岗位','解析筛选','智能匹配','简历定制','授权投递','生成报告'].map((s,i)=>{const map=[0,1,3,4,5,6],done=r&&(step>map[i]),now=r&&step===map[i];return '<div class="flow-step '+(done?'done':now?'now':'')+'"><div class="circle">'+(done?'✓':i+1)+'</div>'+s+'</div>';}).join('')+'</div><div class="flow-note"><span><span class="'+(r?.status==='running'?'pulse':'dot')+'"></span>'+(r?({running:'Agent 正在执行工具调用',waiting:'推荐已就绪，等待你确认模拟投递',completed:'本轮求职任务已完成',paused:'任务已暂停',cancelled:'任务已取消',failed:'执行失败，可恢复'}[r.status]):'准备就绪 · 开始你的第一次智能求职')+'</span><a href="#agent" style="font-size:10px">执行详情 →</a></div>';}
function jobCard(j,detail=false){const m=scoring(j);return '<article class="'+(detail?'card':'')+'"><div class="job"><div class="company-logo" style="background:'+['#edf3ff','#eef8f5','#fff3e9','#f4f0ff'][jobs.indexOf(j)%4]+'">'+esc(j.company.slice(0,1))+'</div><div class="job-info"><div class="job-title"><span>'+esc(j.title)+'</span><span class="salary">'+j.salary+'–'+(j.salary+8)+'k</span></div><div class="job-meta">'+esc(j.company)+' · '+esc(j.city)+' · '+esc(j.degree)+' · 应届</div><div class="tags">'+j.skills.map(s=>'<span class="tag">'+esc(s)+'</span>').join('')+'<span class="tag">'+esc(j.source)+'</span></div><div class="job-bottom"><span class="score">✧ '+m.score+'% 匹配</span><div class="actions">'+btn('匹配详情','job-detail',false,'data-id="'+j.id+'"')+btn('定制简历 →','tailor',false,'data-id="'+j.id+'"')+'</div></div></div></div></article>';}
function dashboard(){const submitted=state.applications.filter(a=>a.receipt).length,offers=state.applications.filter(a=>a.status==='Offer').length;const ranked=[...jobs].sort((a,b)=>scoring(b).score-scoring(a).score);return head('工作台','每一次准备，都在让理想的工作离你更近。',btn(icon('download')+'导出数据','export')+btn(icon('spark')+'开始智能求职','start',true))+'<section class="hero"><div><div class="eyebrow">HELLO, FUTURE EXPLORER</div><h2>'+esc(state.profile.name)+'，你的下一站，从这里启航。</h2><p>让 Agent 帮你发现合适的机会，把时间留给更重要的准备。</p>'+btn('开启我的求职计划 '+icon('arrow'),'start',true)+' <span style="font-size:10px;color:#8a9abd;margin-left:12px">无需 API Key · 即刻体验</span></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div><div class="rocket">✈</div><span class="spark">✧</span></div></section><div class="stats">'+[['发现岗位',jobs.length,'个','24 个虚构岗位 + 你的手动录入','search'],['已投递',submitted,'份','每次提交均有模拟平台回执','send'],['待面试',state.interviews.filter(i=>Date.parse(i.at)>Date.now()).length,'场','合理安排每一次相遇','calendar'],['收获 Offer',offers,'个','记录每一个值得庆祝的时刻','chart']].map(x=>'<div class="stat"><span class="label">'+x[0]+'</span><span class="icon">'+icon(x[4])+'</span><div class="value">'+x[1]+'<span>'+x[2]+'</span></div><div class="foot">'+x[3]+'</div></div>').join('')+'</div><div class="grid"><div>'+card('智能求职 Agent',flow(),'<span class="badge">规则驱动 · 实时执行</span>','bot')+card('为你推荐的机会',ranked.slice(0,3).map(j=>jobCard(j)).join(''),'<a href="#jobs">查看全部 →</a>','spark')+'</div><div>'+card('面试日程',state.interviews.length?state.interviews.slice().sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)).slice(0,3).map(interviewCard).join(''):empty('还没有面试安排<br>下一次好消息，值得期待。'),'<a href="#interviews">管理日程 →</a>','calendar')+card('求职进度','<div class="card-body">'+[['待审核',state.applications.filter(a=>a.status==='待审核').length,'#92b0fb'],['已投递',submitted,'#6d94ed'],['面试中',state.applications.filter(a=>a.status==='面试').length,'#99c9bd'],['已获 Offer',offers,'#b3a0e4']].map(x=>'<div class="progress-row"><span>'+x[0]+'</span><span>'+x[1]+'</span></div><div class="bar"><i style="width:'+Math.min(100,x[1]/Math.max(1,state.applications.length)*100)+'%;background:'+x[2]+'"></i></div>').join('')+'</div>','','chart')+card('今日求职简报','<div class="report"><h3>每一步进展，都看得见</h3><p>'+esc(state.report?.text||'完成一次 Agent 流程，即可生成你的求职日报。')+'</p><a href="#agent" style="font-size:11px">查看执行记录 →</a></div>','','file')+'</div></div><div class="banner">ⓘ 课程演示：岗位和人物均为虚构；评分由可解释规则实时计算，未调用大模型。投递只进入本项目模拟平台。</div>';}
const field=(name,label,value,type='text',wide=false)=>'<div class="field '+(wide?'wide':'')+'"><label for="f-'+name+'">'+label+'</label>'+(type==='textarea'?'<textarea id="f-'+name+'" name="'+name+'">'+esc(value)+'</textarea>':type==='degree'?'<select id="f-'+name+'" name="'+name+'">'+['本科','硕士','博士'].map(x=>'<option '+(value===x?'selected':'')+'>'+x+'</option>').join('')+'</select>':'<input id="f-'+name+'" type="'+type+'" name="'+name+'" value="'+esc(value)+'">')+'</div>';
function profile(){return head('用户档案','档案越清晰，推荐越有依据。你的数据仅在当前工作空间内可见。')+card('求职名片','<form id="profile-form" class="card-body"><div class="formgrid">'+[['name','姓名'],['school','学校'],['major','专业'],['degree','学历','degree'],['graduation','毕业时间','month'],['skills','技能（逗号分隔）'],['target','目标岗位'],['cities','期望城市（逗号分隔）'],['salary','期望月薪（k）','number'],['industry','目标行业'],['exclude','不接受的条件（逗号分隔）'],['projects','项目经历','textarea'],['internships','实习 / 校内经历','textarea']].map(([n,l,t])=>field(n,l,state.profile[n],t||'text',t==='textarea')).join('')+'</div><div class="actions" style="margin-top:22px"><button class="btn primary" type="submit">保存档案</button><span class="note">不会自动将未核实内容加入简历</span></div></form>');}
function resume(){return head('简历管理','保存每一次成长，为不同机会准备合适的版本。',btn(icon('download')+'下载当前文本','download-resume')+btn('导出 DOCX','download-docx'))+card('我的简历','<div class="card-body"><div class="banner">支持 PDF / DOCX / TXT，最大 2 MB。PDF 仅支持基础文本型文件，扫描件与复杂字体请粘贴文本。解析结果务必核对。</div><div style="margin:18px 0"><label class="btn">'+icon('file')+'上传并解析简历<input id="resume-file" type="file" accept=".pdf,.docx,.txt" style="display:none"></label></div><form id="resume-form"><label class="note" for="resume-text">可直接修改解析结果</label><textarea name="text" id="resume-text" style="min-height:310px;margin:8px 0 15px">'+esc(state.resume)+'</textarea><button type="submit" class="btn primary">确认并保存版本</button> '+btn('打印 / 另存 PDF','print-resume')+'</form></div>')+card('版本历史',state.versions.length?'<div class="timeline">'+state.versions.map(v=>'<div class="log"><div><strong>'+esc(v.title)+'</strong><div class="time">'+date(v.createdAt)+' · '+esc(v.engine)+'</div>'+btn('查看与导出','view-version',false,'data-id="'+v.id+'"')+'</div></div>').join('')+'</div>':empty('保存或生成简历后，版本会出现在这里。'));}
function jobPage(){let list=[...jobs].filter(j=>(j.title+j.company+j.skills.join(' ')).toLowerCase().includes(jobQuery.toLowerCase())&&(!cityFilter||j.city===cityFilter)).sort((a,b)=>scoring(b).score-scoring(a).score);return head('岗位推荐','发现适合你的机会，读懂每一份匹配背后的依据。',btn('+ 手动添加岗位','add-job',true))+'<div class="filters"><input id="job-query" aria-label="搜索岗位" placeholder="搜索岗位、公司或技能…" value="'+esc(jobQuery)+'"><select id="city-filter" aria-label="城市"><option value="">全部城市</option>'+[...new Set(jobs.map(j=>j.city))].map(c=>'<option '+(c===cityFilter?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select><span class="badge" style="align-self:center">'+list.length+' 个机会 · 按匹配度排序</span></div><div class="banner" style="margin-bottom:18px">示例公司及岗位为课程虚构数据。手动添加的岗位不会自动联网抓取或验证有效性。</div><div class="joblist">'+(list.map(j=>jobCard(j,true)).join('')||empty('没有找到符合条件的岗位，试试其他关键词。'))+'</div>';}
function tailorPage(){return head('简历优化','基于已有事实整理岗位重点，确认后再用于投递。')+card('选择目标岗位','<div class="card-body"><p class="note">当前引擎按关键词提取已有事实，不调用大模型、不补写经历。缺少的技能只列为待学习项。</p><div class="actions"><select id="tailor-job" style="flex:1;min-width:200px">'+jobs.map(j=>'<option value="'+j.id+'">'+esc(j.company+' · '+j.title)+'</option>').join('')+'</select>'+btn('生成岗位定制版本','tailor-selected',true)+'</div></div>')+card('定制版本',state.versions.filter(v=>v.jobId).length?'<div class="timeline">'+state.versions.filter(v=>v.jobId).map(v=>'<div class="log"><div><strong>'+esc(v.title)+'</strong><p>'+esc(v.engine)+' · '+date(v.createdAt)+'</p><div class="actions">'+btn('对比与确认','view-version',false,'data-id="'+v.id+'"')+btn('创建待审核投递','create-application',true,'data-job="'+v.jobId+'" data-id="'+v.id+'"')+'</div></div></div>').join('')+'</div>':empty('选择一个岗位，生成你的第一份定制版本。'));}
function applicationCard(a){const j=jobBy(a.jobId);return '<article class="application"><h3>'+esc(j?.title||'岗位')+' <span class="badge">'+esc(a.status)+'</span></h3><p>'+esc(j?.company)+' · '+esc(j?.city)+' · 模拟平台</p><div class="actions">'+btn('查看申请材料','application-details',false,'data-id="'+a.id+'"')+(!a.receipt&&!['已结束','被拒绝'].includes(a.status)?btn(a.authorized?'执行模拟提交':'审核并授权','approve',true,'data-id="'+a.id+'"'):'')+'</div>'+(a.receipt?'<p class="green" style="word-break:break-all">回执：'+esc(a.receipt)+'</p>':'')+'<label class="note" for="status-'+a.id+'">更新进度</label><select id="status-'+a.id+'" data-status="'+a.id+'">'+['已发现','待审核','待投递','投递中','已投递','已查看','笔试','面试','Offer','被拒绝','已结束'].map(s=>'<option '+(s===a.status?'selected':'')+'>'+s+'</option>').join('')+'</select><textarea data-note="'+a.id+'" aria-label="投递备注" placeholder="记录沟通情况…">'+esc(a.notes)+'</textarea>'+btn('保存备注','save-note',false,'data-id="'+a.id+'"')+'</article>';}
function applications(){return head('自动投递','每一次提交，都由你确认。所有任务仅发送至课程模拟平台。')+'<div class="banner" style="margin-bottom:20px">提交前可审阅申请表和简历。授权仅适用于当前任务；重复执行会返回同一回执。</div>'+(state.applications.length?'<div class="joblist">'+state.applications.map(applicationCard).join('')+'</div>':card('投递任务',empty('还没有待处理任务。运行 Agent 或从定制简历创建投递。')+'<div class="card-body">'+btn('开始智能求职','start',true)+'</div>'));}
function board(){const groups=[['待准备',['已发现','待审核','待投递']],['已提交',['投递中','已投递','已查看']],['流程进展',['笔试','面试','Offer','被拒绝','已结束']]];return head('投递进度','从初次发现，到最终选择，把求职的每一步都整理清楚。')+'<div class="tabs" style="margin-bottom:20px">'+['全部','待审核','已投递','面试','Offer','已结束'].map(s=>'<button class="'+(boardFilter===s?'active':'')+'" data-boardfilter="'+s+'">'+s+'</button>').join('')+'</div><div class="board">'+groups.map(([name,statuses])=>{const list=state.applications.filter(a=>statuses.includes(a.status)&&(boardFilter==='全部'||a.status===boardFilter));return '<section class="boardcol"><h3>'+name+' <span style="float:right">'+list.length+'</span></h3>'+list.map(applicationCard).join('')+(list.length?'':empty('暂无任务'))+'</section>';}).join('')+'</div>';}
function interviewCard(i){const d=new Date(i.at);return '<div class="schedule"><div class="datebox">'+(d.getMonth()+1)+'月<strong>'+d.getDate()+'</strong></div><div><h3>'+esc(i.company)+' · '+esc(i.role)+'</h3><p>'+date(i.at)+' · '+esc(i.round||'一面')+'</p><p>'+esc(i.location||'线上面试')+'</p>'+(i.link?'<a target="_blank" rel="noopener" href="'+esc(i.link)+'" style="font-size:10px">进入会议 ↗</a>':'')+'<p>'+esc(i.result||'结果待记录')+'</p></div></div>';}
function interviews(){return head('面试日程','充分准备每一场对话，系统会检查一小时内的时间冲突。',btn('+ 新建面试','add-interview',true))+card('我的面试',state.interviews.length?state.interviews.slice().sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)).map(i=>'<div>'+interviewCard(i)+'<div style="padding:0 22px 15px">'+btn('下载日历提醒','calendar-export',false,'data-id="'+i.id+'"')+' '+btn('删除日程','delete-interview',false,'data-id="'+i.id+'"')+'</div></div>').join(''):empty('还没有面试，先添加一个日程吧。'))+card('提醒方式','<div class="card-body note">下载 .ics 后导入系统日历，可提前 30 分钟提醒。本站不发送邮件或后台推送。</div>');}
function agent(){const r=state.runs[0];return head('Agent 执行中心','每一个工具调用、每一次状态变化，都有迹可循。',btn(icon('play')+'开始新任务','start',true))+card('当前工作流',flow()+'<div class="card-body actions">'+(r?.status==='running'?btn('暂停','pause'):'')+(['paused','failed'].includes(r?.status)?btn('恢复执行','resume',true):'')+(['running','waiting','paused','failed'].includes(r?.status)?btn('取消本轮任务','cancel'):'')+(r?.status==='waiting'?btn('前往授权投递','go-applications',true)+btn('投递处理完毕 · 生成日报','finish'):'')+'</div>')+card('执行时间线',r?'<div class="timeline">'+r.logs.map(l=>'<div class="log"><div><strong>'+esc(l.label)+'</strong> <span class="badge">tool: '+esc(l.tool)+'</span><p>'+esc(l.detail)+'</p><div class="time">'+date(l.at)+'</div></div></div>').join('')+(r.error?'<div class="errorbox">'+esc(r.error)+'</div>':'')+'</div>':empty('点击开始新任务，查看真实执行的工具调用。'))+card('求职日报','<div class="card-body"><p>'+esc(state.report?.text||'完成授权投递阶段后生成日报。')+'</p><span class="note">'+(state.report?date(state.report.at):'暂无报告')+'</span></div>')+card('历史任务','<div class="card-body">'+(state.runs.map(x=>'<details style="padding:10px;border-bottom:1px solid #edf1f7"><summary>'+date(x.createdAt)+' · '+esc(x.status)+' · '+x.logs.length+' 次调用</summary><pre style="white-space:pre-wrap;font-size:11px">'+esc(JSON.stringify(x.logs,null,2))+'</pre></details>').join('')||'<span class="note">暂无历史</span>')+'</div>');}
function settings(){return head('偏好设置','让工作流按你的节奏运行。默认始终需要逐项授权。')+card('推荐与执行偏好','<form id="settings-form" class="card-body"><div class="formgrid">'+field('threshold','最低匹配分数（0–100）',state.settings.threshold,'number')+field('limit','每轮最多推荐（1–10）',state.settings.limit,'number')+'<div class="field"><label><input type="checkbox" name="tailor" '+(state.settings.tailor?'checked':'')+'> 自动整理定制简历</label></div><div class="field"><label><input type="checkbox" checked disabled> 提交前逐项确认（强制启用）</label></div></div><button class="btn primary" style="margin-top:20px">保存设置</button></form>')+card('每日任务与成本','<div class="card-body"><p class="note">当前使用手动触发；尚未配置云端定时执行。关闭页面后不会继续执行 Agent，重新打开可以恢复。</p><p class="note">模型：规则模式，不调用收费 API。无银行卡、无付费订阅、无按量升级配置。免费托管额度可能变化，以平台实际限制为准。</p>'+btn('手动执行每日求职','start',true)+'</div>')+card('隐私与数据','<div class="card-body"><p class="note">档案、简历和历史存于服务端，按登录身份或随机 Demo 会话隔离。不要在公开演示中上传真实敏感简历。删除仅影响当前身份；再次访问会初始化虚构数据。</p><div class="actions">'+btn('导出我的数据','export')+btn('删除我的全部数据','delete-data')+'</div></div>');}
function demo(){return head('Demo 演示中心','3–5 分钟，走完一次有据可查的智能求职之旅。')+card('从这里开始','<div class="card-body"><span class="badge">无需招聘账号 · 无需模型密钥</span><ol class="checklist"><li>查看用户档案和测试简历（30 秒）</li><li>点击「开始智能求职」，查看 Agent 发现、筛选和匹配岗位（45 秒）</li><li>查看匹配依据与定制简历，核对已有经历（45 秒）</li><li>在自动投递逐项确认简历并授权模拟提交（60 秒）</li><li>查看回执、修改进度并添加面试（45 秒）</li><li>返回 Agent 执行中心，完成任务并查看日报（30 秒）</li></ol><div class="actions">'+btn('开始智能求职 →','start',true)+(identity==='demo'?btn('重置本次演示数据','reset'):'')+'</div></div>')+card('演示边界与真实能力','<div class="card-body"><p class="note">✓ 实际运行：工具调用状态机、规则评分、档案保存、简历版本、授权校验、模拟申请提交与回执、防重复、看板、面试冲突、日报。</p><p class="note">△ 当前未接入：大模型推理、真实岗位采集、真实平台投递、云端定时任务、OCR。PDF 通过浏览器打印导出。</p><p class="note">所有公司和林知夏档案均为虚构。匹配结果实时计算；页面不会预置成功投递或 Offer。</p></div>');}
function render(){if(!state)return;document.getElementById('nav').innerHTML=pages.map(([id,label,ic],i)=>(i===8?'<div class="navlabel">TOOLS / 更多工具</div>':'')+'<button data-page="'+id+'" class="'+(view===id?'active':'')+'">'+icon(ic)+label+(id==='applications'&&state.applications.filter(a=>a.status==='待审核').length?'<span class="count">'+state.applications.filter(a=>a.status==='待审核').length+'</span>':'')+'</button>').join('');document.getElementById('crumb').textContent=pages.find(p=>p[0]===view)?.[1]||'工作台';const renderers={dashboard,profile,resume,jobs:jobPage,tailor:tailorPage,applications,board,interviews,agent,settings,demo};document.getElementById('app').innerHTML=(renderers[view]||dashboard)()+'<footer class="footer"><span>OfferPilot © 2026 · 把握方向，自在启航</span><span>课程项目 · 规则模式 · 模拟投递</span></footer>';}
function modal(title,body){document.getElementById('modalroot').innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'" tabindex="-1"><button class="close" data-action="close" aria-label="关闭">×</button><h2>'+esc(title)+'</h2>'+body+'</section></div>';document.querySelector('.modal').focus();}
function closeModal(){document.getElementById('modalroot').innerHTML='';}
function download(name,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function showVersion(v){modal(v.title,'<p class="note">'+esc(v.engine)+'。请核对内容；只有确认后才允许提交。</p>'+(v.original?'<details><summary>修改前 · 原始简历</summary><pre>'+esc(v.original)+'</pre></details>':'')+'<h3 style="font-size:13px">'+(v.original?'整理后':'简历内容')+'</h3><pre id="print-content">'+esc(v.text)+'</pre>'+(v.missing?.length?'<p class="note">缺失技能（未添加到简历）：'+esc(v.missing.join('、'))+'</p>':'')+'<div class="actions">'+btn('下载 TXT','download-version',false,'data-id="'+v.id+'"')+btn('导出 DOCX','download-docx',false,'data-id="'+v.id+'"')+btn('打印 / 另存 PDF','print-version',false,'data-id="'+v.id+'"')+(v.jobId?btn('创建待审核投递','create-application',true,'data-job="'+v.jobId+'" data-id="'+v.id+'"'):'')+'</div>');}
function scheduleTick(){clearTimeout(timer);if(state.runs[0]?.status==='running')timer=setTimeout(async()=>{if(busy){scheduleTick();return;}busy=true;try{await api('agent/tick',{});await refresh();}catch(e){toast(e.message);}finally{busy=false;scheduleTick();}},900);}
async function action(a,el){if(a==='close'){closeModal();return;}if(a==='go-applications'){navigate('applications');return;}if(a==='export'){const data=await api('export');download('offerpilot-data.json',JSON.stringify(data,null,2),'application/json');return;}if(a==='download-resume'){download('OfferPilot-简历.txt',state.resume);return;}if(a==='download-docx'){const r=await fetch('/api/docx'+(el.dataset.id?'?version='+encodeURIComponent(el.dataset.id):''));if(!r.ok)throw Error('导出失败');download('OfferPilot-简历.docx',new Uint8Array(await r.arrayBuffer()),'application/vnd.openxmlformats-officedocument.wordprocessingml.document');return;}if(a==='download-version'){download('OfferPilot-定制简历.txt',state.versions.find(v=>v.id===el.dataset.id).text);return;}if(a==='print-resume'||a==='print-version'){const v=a==='print-resume'?{title:'我的简历',text:state.resume,engine:'用户简历'}:state.versions.find(v=>v.id===el.dataset.id);showVersion(v);window.print();return;}
 if(a==='start'){await api('agent/start',{});navigate('agent');toast('工作流已启动，正在执行工具调用');}
 if(['pause','resume','cancel','finish'].includes(a)){await api('agent/control',{action:a});toast('任务状态已更新');}
 if(a==='tailor'||a==='tailor-selected'){const id=a==='tailor'?el.dataset.id:document.getElementById('tailor-job').value;const v=await api('tailor',{jobId:id});await refresh();showVersion(v);return;}
 if(a==='view-version'){showVersion(state.versions.find(v=>v.id===el.dataset.id));return;}
 if(a==='job-detail'){const j=jobBy(el.dataset.id),m=scoring(j);modal(j.title,'<div class="job-detail"><p>'+esc(j.company+' · '+j.city+' · '+j.degree+' · '+j.salary+'k起')+'</p><span class="score">'+m.score+' / 100 · 实时规则评分</span><table>'+[['技能',Math.round(45*m.have.length/Math.max(1,j.skills.length))+'/45',m.have.join('、')||'未找到证据'],['城市',m.city+'/15',state.profile.cities],['学历',m.degree+'/15',state.profile.degree+' → '+j.degree],['目标岗位',m.target+'/15',state.profile.target],['薪资',m.salary+'/10','期望 '+state.profile.salary+'k']].map(x=>'<tr>'+x.map(t=>'<td>'+esc(t)+'</td>').join('')+'</tr>').join('')+'</table><p>缺失技能：'+esc(m.missing.join('、')||'无')+'</p><p>硬性条件：'+(m.degree&&!m.excluded?'通过':'未通过')+'</p><p>事实：以上技能来自你的简历或档案。推测：关键词重合可能反映项目相关性，不能代表招聘方判断。</p><p>岗位职责：'+esc(j.jd)+'</p><p>截止：'+esc(j.deadline)+' · 来源：'+esc(j.source)+'</p>'+(j.url?'<a href="'+esc(j.url)+'" target="_blank" rel="noopener">原始岗位链接 ↗</a>':'')+'</div><div class="actions" style="margin-top:15px">'+btn('为此岗位整理简历','tailor',true,'data-id="'+j.id+'"')+'</div>');return;}
 if(a==='create-application'){await api('applications/create',{jobId:el.dataset.job,versionId:el.dataset.id});closeModal();navigate('applications');toast('已创建待审核任务，尚未提交');}
 if(a==='approve'){const task=state.applications.find(a=>a.id===el.dataset.id),j=jobBy(task.jobId),v=state.versions.find(v=>v.id===task.versionId);modal('审核模拟申请 · '+j.company,'<p class="note">本次只提交至 OfferPilot 虚构招聘平台。不会联系公司或发送真实申请。</p><div class="job-detail"><p>申请人：'+esc(state.profile.name)+'</p><p>岗位：'+esc(j.title)+'</p><pre>'+esc(v?.text||state.resume)+'</pre></div><label style="display:block;margin:18px 0;font-size:12px"><input type="checkbox" id="approve-check" style="width:auto"> 我已核对简历，明确授权本次模拟提交</label>'+btn('授权并执行模拟提交','confirm-submit',true,'data-id="'+task.id+'"'));return;}
 if(a==='confirm-submit'){if(!document.getElementById('approve-check').checked)throw Error('请先核对材料并勾选授权');await api('applications/authorize',{id:el.dataset.id,approved:true,resumeConfirmed:true});await api('applications/submit',{id:el.dataset.id});closeModal();toast('模拟申请已提交，回执已保存');}
 if(a==='application-details'){const task=state.applications.find(a=>a.id===el.dataset.id),v=state.versions.find(v=>v.id===task.versionId);modal('申请记录与回执','<pre>'+esc(task.form?.resumeText||v?.text||state.resume)+'</pre><p class="note">'+esc(task.receipt||'尚未提交，没有回执')+'</p><div class="timeline">'+task.timeline.map(l=>'<div class="log"><div>'+esc(l.text)+'<div class="time">'+date(l.at)+'</div></div></div>').join('')+'</div>');return;}
 if(a==='save-note'){await api('applications/update',{id:el.dataset.id,notes:document.querySelector('[data-note="'+el.dataset.id+'"]').value});toast('备注已保存');}
 if(a==='add-job'){modal('手动添加岗位','<form id="job-form"><div class="formgrid">'+field('company','公司名称','')+field('title','岗位名称','')+field('city','工作城市','上海')+field('salary','月薪起点（k）',15,'number')+field('degree','学历','本科','degree')+field('skills','技能（逗号分隔）','')+field('url','原始 HTTPS 链接','','url')+field('deadline','截止时间','2027-06-30','date')+field('jd','完整岗位 JD','','textarea',true)+'</div><p class="note">仅保存你输入的信息，不抓取招聘网站。</p><button class="btn primary">保存岗位</button></form>');return;}
 if(a==='add-interview'){modal('添加面试日程','<form id="interview-form"><div class="formgrid">'+field('company','公司名称','')+field('role','岗位名称','')+field('at','面试时间（北京时间）','','datetime-local')+field('round','面试轮次','一面')+field('location','面试地点','线上')+field('link','会议 HTTPS 链接','','url')+field('result','面试结果 / 准备备注','','textarea',true)+'</div><button class="btn primary" style="margin-top:18px">保存日程</button></form>');return;}
 if(a==='calendar-export'){const i=state.interviews.find(i=>i.id===el.dataset.id),stamp=t=>new Date(t).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z'),ics=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,'\\$&');download('面试提醒.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//OfferPilot//CN','BEGIN:VEVENT','UID:'+i.id+'@offerpilot','DTSTAMP:'+stamp(Date.now()),'DTSTART:'+stamp(i.at),'DTEND:'+stamp(Date.parse(i.at)+3600000),'SUMMARY:'+ics(i.company+' '+i.role+' '+i.round),'LOCATION:'+ics(i.location||''),'DESCRIPTION:'+ics(i.link||''),'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:面试提醒','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'),'text/calendar');return;}
 if(a==='delete-interview'){if(!confirm('删除这条面试日程？'))return;await api('interviews/delete',{id:el.dataset.id});toast('日程已删除');}
 if(a==='reset'){if(!confirm('重置当前 Demo 的档案、简历、任务和投递记录？此操作无法撤销。'))return;await api('demo/reset',{});navigate('dashboard');toast('已恢复全新演示数据');}
 if(a==='delete-data'){if(!confirm('永久删除当前身份的全部数据？请先导出备份。'))return;await api('account',{},'DELETE');location.reload();return;}
 await refresh();}
document.addEventListener('click',async e=>{const page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page);return;}const filter=e.target.closest('[data-boardfilter]');if(filter){boardFilter=filter.dataset.boardfilter;render();return;}const el=e.target.closest('[data-action]');if(!el)return;const wasDisabled=el.disabled;el.disabled=true;try{await action(el.dataset.action,el);}catch(err){toast(err.message);}finally{el.disabled=wasDisabled;}});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target,data=Object.fromEntries(new FormData(form));const button=form.querySelector('button[type=submit],button');button.disabled=true;try{if(form.id==='profile-form'){await api('profile',data);toast('档案已保存');}if(form.id==='resume-form'){await api('resume',data);toast('简历版本已保存');}if(form.id==='settings-form'){data.tailor=!!form.querySelector('[name=tailor]').checked;await api('settings',data);toast('偏好已保存');}if(form.id==='job-form'){await api('jobs/add',data);closeModal();toast('岗位已添加');}if(form.id==='interview-form'){data.at=data.at+':00+08:00';await api('interviews',data);closeModal();toast('日程已保存');}await refresh();}catch(err){toast(err.message);}finally{button.disabled=false;}});
document.addEventListener('change',async e=>{try{if(e.target.id==='city-filter'){cityFilter=e.target.value;render();}if(e.target.dataset.status){await api('applications/update',{id:e.target.dataset.status,status:e.target.value});await refresh();toast('状态已更新');}if(e.target.id==='resume-file'){const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024)throw Error('文件超过 2 MB');toast('正在解析文件…');const bytes=new Uint8Array(await f.arrayBuffer());let raw='';for(let i=0;i<bytes.length;i+=8192)raw+=String.fromCharCode(...bytes.subarray(i,i+8192));await api('upload',{name:f.name,base64:btoa(raw)});await refresh();toast('文本已提取，请核对后保存');}}catch(err){toast(err.message);if(e.target.dataset.status)await refresh();}});
document.addEventListener('input',e=>{if(e.target.id==='job-query'){jobQuery=e.target.value;const p=e.target.selectionStart;render();const input=document.getElementById('job-query');input.focus();input.setSelectionRange(p,p);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){const focusables=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea,.modal a')].filter(x=>!x.disabled);if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));refresh().catch(e=>document.getElementById('app').innerHTML='<div class="errorbox">无法载入：'+esc(e.message)+'<br><button class="btn" onclick="location.reload()">重试</button></div>');
</script></body></html>
